name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check lockfile
        run: uv lock --check --offline
      - name: Run offline tests
        run: PYTHONPATH=src uv run --offline python -m unittest discover -s tests -p 'test_*.py' -q

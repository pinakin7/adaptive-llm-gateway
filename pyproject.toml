[project]
name = "adaptive-llm-gateway"
version = "0.0.0"
description = "Experimental LLM gateway and coding task evaluation harness"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.120.4",
    "httpx==0.28.1",
    "uvicorn==0.38.0",
]

[tool.uv]
package = false

[dependency-groups]
transport-spike = [
    "litellm==1.103.0",
]

